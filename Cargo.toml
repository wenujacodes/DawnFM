[package]
name = "dawnfm"
version = "2.6.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/wenujacodes/DawnFM"
description = "Dawn FM: a native YouTube Music app for macOS"

[lib]
name = "dawnfm"
path = "src/lib.rs"

[[bin]]
name = "dawnfm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
discord-rich-presence = "1.1.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "wgpu_no_default_features", "default_fonts", "links", "clipboard", "accesskit", "persistence"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
env_logger = { version = "0.11.11", default-features = false, features = ["humantime"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Dolby Atmos from hi-res addons: E-AC-3 JOC decoded to stereo (dash.rs).
filmcraft-ac3 = "0.9.0"
localzone = "0.3.1"
log = "0.4.34"
memmap2 = "0.9.11"
mimalloc = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "gzip", "json", "socks"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-flac", "symphonia-alac", "symphonia-wav", "symphonia-mp3", "symphonia-vorbis"] }
rquickjs = "0.14.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
skrifa = "0.44.0"
sha1 = "0.10.7"
sha2 = "0.10.9"
hmac = "0.12.1"
serde_json = "1.0.151"
souvlaki = "0.8.3"
tao = "0.37.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
wry = "0.57.0"
rfd = "0.17.2"
tray-icon = "0.26.1"
url = "2.5.8"
# The opt-in renderer: Metal (macOS) / Vulkan (Windows) (renderer.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
mp4ameta = "0.13.0"
md-5 = "0.10"
unicode-normalization = "0.1.26"
symphonia = { version = "0.5.5", default-features = false, features = ["mkv"] }
rusty-opus = "1.0.2"
rust-i18n = "3.1"
sys-locale = "0.3"
unicode-bidi = "0.3"

# The login Keychain for the sign-ins.
[target.'cfg(windows)'.dependencies]
# Windows Credential Manager, for the Google and Spotify sign-ins.
keyring = { version = "3.6.3", features = ["windows-native"] }
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain for the sign-ins.
keyring = { version = "3.6.3", features = ["apple-native"] }
# Jam links: the kAEGetURL Apple Event handler (deeplink.rs). The versions winit/wry lock.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind, not abort: a panic while handling one request (in a library or a parser)
# must fail that request, not close the app.
panic = "unwind"

# Keep debug builds usable: optimize dependencies (decoders, egui) even in dev.
[profile.dev.package."*"]
opt-level = 2

# egui with a smaller trackpad bounce at the ends of scrollers (see
# vendor/egui/src/containers/scroll_physics.rs, the three "Dawn FM" constants).
[patch.crates-io]
egui = { path = "vendor/egui" }
