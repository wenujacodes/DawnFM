name: Release

# Push a tag like v2.1.0 to build Dusk FM for Apple Silicon and Intel and publish it
# to the public DuskFM-Releases repo, with the source code attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Work out the version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Make the app bundles
        run: |
          sh macos/bundle.sh target/release/duskfm "${{ steps.version.outputs.value }}" out
          sh macos/bundle.sh target/release/duskfm "${{ steps.version.outputs.value }}" out-portable portable

      # The app's updater looks for these exact names (asset_name in src/update.rs).
      - name: Package .dmg and .zip
        run: |
          v="${{ steps.version.outputs.value }}"
          name="DuskFM-$v-macos-${{ matrix.arch }}"
          mkdir -p dist dmg
          ditto -c -k --keepParent "out/Dusk FM.app" "dist/$name.zip"
          ditto -c -k --keepParent "out-portable/Dusk FM.app" "dist/$name-portable.zip"
          cp -R "out/Dusk FM.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Dusk FM" -srcfolder dmg -ov -format UDZO "dist/$name.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish to the public releases repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The full history, for the source zip and the list of changes since the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # GPL-3.0: the code is private, so every release carries its full source.
      - name: Source code zip
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=zip -o "dist/DuskFM-$v-source.zip" "$GITHUB_REF_NAME"
          ls -lh dist

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "The app is signed ad hoc, so macOS asks before the first launch: right-click Dusk FM and choose Open."
            echo
            echo "- **Apple Silicon** (M1 and newer): \`arm64\` · **Intel**: \`x64\`"
            echo "- \`.dmg\`: drag Dusk FM to Applications. \`-portable.zip\`: keeps its settings in a folder beside the app."
            echo "- \`-source.zip\`: the full source code of this version (GPL-3.0)."
            echo
            echo "## Changes"
            if [ -n "$prev" ]; then git log --no-merges --pretty='- %s' "$prev..$GITHUB_REF_NAME"; else echo "- First release"; fi
          } > notes.md
          cat notes.md

      - name: Create the release in the public repo
        env:
          # A fine-grained token with Contents: read and write on DuskFM-Releases.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo wenujacodes/DuskFM-Releases \
            --title "Dusk FM ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
