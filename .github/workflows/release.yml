name: Release

# Push a tag like v2.1.0 to build Dawn FM for Apple Silicon and Intel and publish a
# GitHub Release with a .dmg and zips for each.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Work out the version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Make the app bundle
        run: |
          sh macos/bundle.sh target/release/dawnfm "${{ steps.version.outputs.value }}" out

      # The app's updater looks for these exact names (asset_name in src/update.rs).
      - name: Package .dmg
        run: |
          v="${{ steps.version.outputs.value }}"
          name="DawnFM-$v-macos-${{ matrix.arch }}"
          mkdir -p dist dmg
          cp -R "out/Dawn FM.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Dawn FM" -srcfolder dmg -ov -format UDZO "dist/$name.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x64

      - name: Work out the version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked --release

      - name: Build
        run: cargo build --locked --release

      - name: Package installer with Inno Setup
        shell: pwsh
        run: |
          ISCC.exe installer/dawnfm.iss

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null

          # Rename Inno Setup output to updater convention
          if (Test-Path "dist/dawnfm-setup-v*.exe") {
            Copy-Item "dist/dawnfm-setup-v*.exe" "dist/DawnFM-$v-windows-x64-setup.exe"
          }

          # Portable bundle
          $portableFiles = @("target/release/dawnfm.exe", "installer/portable.txt", "README.md", "LICENSE")
          if (Test-Path "target/release/WebView2Loader.dll") {
            $portableFiles += "target/release/WebView2Loader.dll"
          }
          Compress-Archive -Path $portableFiles -DestinationPath "dist/DawnFM-$v-windows-x64-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*

  release:
    name: Publish the release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      # The full history, for the list of changes since the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          tag_body=""
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME" 2>/dev/null)" = "tag" ]; then
            tag_body=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          fi
          if printf '%s' "$tag_body" | grep -q '[^[:space:]]'; then
            printf '%s\n' "$tag_body" > notes.md
          else
            prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            {
              echo "Dawn FM is a fast, lightweight native YouTube Music player built in Rust."
              echo
              echo "### Windows Installation & SmartScreen"
              echo "- **Installer**: Run \`DawnFM-${GITHUB_REF_NAME#v}-windows-x64-setup.exe\` to install."
              echo "- **Portable**: Extract \`DawnFM-${GITHUB_REF_NAME#v}-windows-x64-portable.zip\` and run \`dawnfm.exe\`."
              echo "- **If blocked by Windows SmartScreen**: Right-click the \`.exe\` or \`.zip\` → **Properties** → check **Unblock** at the bottom → click **OK**."
              echo
              echo "## Changes"
              if [ -n "$prev" ]; then
                git log --no-merges --pretty='- %s' "$prev..$GITHUB_REF_NAME" | grep -v -E "^- (build:|Bump version)" || echo "- Bug fixes and improvements"
              else
                echo "- First release"
              fi
            } > notes.md
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Dawn FM ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
